<div class="lm-mgmt">
  <button
    type="button"
    class="lm-mgmt__btn-back"
    (click)="returnToDashboard()"
    aria-label="Voltar para o dashboard"
  >
    <span class="lm-mgmt__btn-back-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <span>Dashboard</span>
  </button>

  <div class="lm-mgmt__header">
    <h2>Gerenciar Links</h2>
    @if (!showForm()) {
      <button
        class="lm-mgmt__btn-create"
        (click)="openCreateForm()"
        [disabled]="loading()"
      >
        + Novo Link
      </button>
    }
  </div>

  @if (errorMessage()) {
    <div class="lm-mgmt__error">
      {{ errorMessage() }}
    </div>
  }

  @if (loading()) {
    <div class="lm-mgmt__loading">
      <div class="lm-mgmt__spinner"></div>
      <p>Carregando links...</p>
    </div>
  }

  @if (showForm()) {
    <div class="lm-mgmt__form-container">
      <h3>{{ editingLink() ? 'Editar Link' : 'Criar Novo Link' }}</h3>
      <app-link-form
        [editingLink]="editingLink()"
        (linkSaved)="onLinkSaved($event)"
        (formClosed)="onFormClosed()"
      />
    </div>
  }

  @if (!showForm()) {
    <app-links-list
      [links]="links()"
      [loading]="loading()"
      (editLink)="onEditLink($event)"
      (deleteLink)="onDeleteLink($event)"
    />
  }
</div>
