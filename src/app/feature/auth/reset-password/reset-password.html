<section class="auth-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h2>Redefinir Senha</h2>
      <p>Digite a nova senha para concluir o acesso.</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="resetPassword()">
      <div class="auth-field">
        <label for="reset-password">Nova Senha</label>
        <input id="reset-password" type="password" formControlName="password" autocomplete="new-password" />
      </div>

      <div class="auth-field">
        <label for="reset-confirm">Confirmar Senha</label>
        <input id="reset-confirm" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </div>

      <button class="auth-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Atualizando...' : 'Atualizar senha' }}
      </button>

      <p class="auth-success" *ngIf="success" role="status">
        {{ success }}
      </p>

      <p class="auth-error" *ngIf="error" role="alert">
        {{ error }}
      </p>
    </form>

    <nav class="auth-links" aria-label="Navegacao de autenticacao">
      <a routerLink="/login">Voltar para login</a>
    </nav>
  </div>
</section>
