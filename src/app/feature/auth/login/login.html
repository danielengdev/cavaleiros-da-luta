<section class="login-wrapper">
  <div class="login-shell">
    <div class="login-card">
    <img
      class="login-logo"
      src="/assets/img/cavaleiros-da-luta-logotipo.jpeg"
      alt="Logotipo da A.R.L.S. Cavaleiros da Luta"
    />

    <header class="login-header">
      <h2>Área de Acesso</h2>
      <p>Entre para administrar os links da loja.</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="login()">
      <div class="login-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="login-field">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>

      <button class="login-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="login-error" *ngIf="error" role="alert">
        {{ error }}
      </p>
    </form>

    <nav class="login-links" aria-label="Navegacao de autenticacao">
      <a routerLink="/register">Criar conta</a>
      <a routerLink="/forgot-password">Esqueci minha senha</a>
    </nav>
    </div>
  </div>
</section>
