<section class="auth-wrapper">
  <div class="auth-card">
    <header class="auth-header">
      <h2>Recuperar Senha</h2>
      <p>Informe seu email para receber o link de redefinicao.</p>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="sendResetLink()">
      <div class="auth-field">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <button class="auth-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Enviar link' }}
      </button>

      <p class="auth-success" *ngIf="success" role="status">
        {{ success }}
      </p>

      <p class="auth-error" *ngIf="error" role="alert">
        {{ error }}
      </p>
    </form>

    <nav class="auth-links" aria-label="Navegacao de autenticacao">
      <a routerLink="/login">Voltar para login</a>
      <a routerLink="/register">Criar conta</a>
    </nav>
  </div>
</section>
