<section class="simple-screen simple-screen--with-nav">
  <div class="simple-screen__body">
    <app-feature-header
      title="Notificacoes"
      description="Acompanhe avisos importantes, atualizacoes recentes e pendencias da sua conta."
    />

    <article class="simple-screen__summary">
      <div>
        <p class="simple-screen__eyebrow">Central de avisos</p>
        <h2 class="simple-screen__summary-title">{{ unreadCount() }} novas notificacoes</h2>
      </div>

      <span class="simple-screen__summary-badge">Hoje</span>
    </article>

    <div class="simple-screen__stack">
      @for (item of notifications(); track item.id) {
        <article class="simple-screen__panel" [class.simple-screen__panel--highlight]="item.tone === 'highlight'">
          <div class="simple-screen__panel-top">
            <h2 class="simple-screen__subtitle">{{ item.title }}</h2>
            <span class="simple-screen__time">{{ item.timeLabel }}</span>
          </div>

          <p class="simple-screen__text">{{ item.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
