<section class="simple-screen simple-screen--with-nav">
  <div class="simple-screen__body">
    <app-feature-header
      title="Notificacoes"
      description="Rota inicial para listar avisos, alertas e atualizacoes do usuario."
    />

    <div class="simple-screen__stack">
      <article class="simple-screen__panel">
        <h2 class="simple-screen__subtitle">Atualizacao de servicos</h2>
        <p class="simple-screen__text">A Home foi conectada a uma rota real de notificacoes para evolucao futura da lista.</p>
      </article>

      <article class="simple-screen__panel">
        <h2 class="simple-screen__subtitle">Proxima etapa</h2>
        <p class="simple-screen__text">Substituir este conteudo por uma fonte de dados real ou mock centralizado.</p>
      </article>
    </div>
  </div>

  <app-home-bottom-nav activeItem="notifications" [unreadCount]="3" />
</section>
