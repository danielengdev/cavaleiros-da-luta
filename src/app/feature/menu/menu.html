<section class="simple-screen simple-screen--with-nav">
  <div class="simple-screen__body">
    <app-feature-header title="Menu" description="Navegue pelas areas principais e acesse a autenticacao da plataforma." />

    <div class="simple-screen__card-list">
      @for (item of menuItems(); track item.route) {
        <a class="simple-screen__card" [routerLink]="item.route">
          <span class="simple-screen__card-title">{{ item.title }}</span>
        </a>
      }

      <button class="simple-screen__card simple-screen__card--action" type="button" (click)="handleAuthAction()">
        <span class="simple-screen__card-title">{{ isAuthenticated() ? 'Sair' : 'Logar' }}</span>
      </button>
    </div>
  </div>
</section>
